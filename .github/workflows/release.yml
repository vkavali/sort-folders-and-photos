name: Build installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write         # required for build attestation (sigstore)
  attestations: write     # required for build attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build app bundle (PyInstaller)
        run: python -m PyInstaller --noconfirm SemanticFileAggregator.spec

      - name: Resolve version string
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main" -or $tag -eq "master") { $tag = "0.0.0" }
          $v = $tag -replace '^v',''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "Output/SemanticFileAggregator-Setup.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SemanticFileAggregator-Setup.exe" | Out-File -Encoding ascii "$exe.sha256"
          Write-Host "SHA-256: $hash"

      - name: Generate build attestation (sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: Output/SemanticFileAggregator-Setup.exe

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SemanticFileAggregator-Setup
          path: |
            Output/SemanticFileAggregator-Setup.exe
            Output/SemanticFileAggregator-Setup.exe.sha256

      - name: Publish GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/SemanticFileAggregator-Setup.exe
            Output/SemanticFileAggregator-Setup.exe.sha256
          generate_release_notes: true
